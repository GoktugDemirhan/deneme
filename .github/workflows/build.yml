name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK oluştur
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Cuzdanim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cuzdanim-apk
          path: Cuzdanim.apk

      - name: Sürüm (Releases) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cüzdanım 1.0.${{ github.run_number }}
          files: Cuzdanim.apk
